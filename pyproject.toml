[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "udsyntax"
version = "0.1.0"
description = "Extract simple syntax graphs from spaCy Universal Dependencies parses of Greek and Latin texts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Neel Smith" }]
dependencies = [
    "spacy>=3.8,<4.0",
    "polars>=1.0",
]

[project.optional-dependencies]
graph = ["networkx>=3.0"]
dev = ["pytest>=7.0"]
docs = ["pdoc>=14.0"]

[project.urls]
Homepage = "https://github.com/neelsmith/udsyntax"

[tool.hatch.build.targets.wheel]
packages = ["src/udsyntax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
